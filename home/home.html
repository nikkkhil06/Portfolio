<head>
    <title>My PORTFOLIO</title>

<body>
    <section class="home">
        <div class="navbar">  
            <a class="nav-item" id="button1" onclick=""> Home</a>
            <a class="nav-item" id="button2" onclick="">About</a>
            <a class="nav-item" href="#">Projects</a>
            <a class="nav-item" href="#">Skills</a>
            <a class="nav-item" href="#">Contact ME</a>
            <div class="mainslider"></div>
        </div>
        <div class="info-sec">
            <h1 style="font-size:3rem;font-weight: 800;">Hi, I'm <br> </h1><br>
            <h1 class="2ndhead" style="font-weight:800;" >NIKHIL VISHWAKARMA<br> </h1><br>
            <h2 style="font-size:x-large">A Frontend DEVELOPER<br><br></h2>
            <h4>A bsc-cs student, currently studying in 1st year of college at Marathwada Mitra Mandal's College, Deccan Pune</h4>
        </div>
        <div class="social-links">
            <h4 class="h04">Follow ME:</h4>
            <img class="git" src="github-icon.png" onclick="location.href='https://github.com/nikkkhil06/Portfolio'">
            <img class="insta" src="instagram-icon.jpg" onclick="location.href='https://instagram.com/nikhilvishwakarma06'">
            <img class="linkedin" src="linkedin-icon.jpg">
        </div>

        <div class="photo-sec">
        </div>
        <script>
        const items = document.querySelectorAll(".nav-item");
        const slider = document.querySelector(".mainslider");
        const firstItem = items[0];
        firstItem.classList.add("active");
        slider.style.left = firstItem.offsetLeft + "px";
        slider.style.width = firstItem.offsetWidth + "px";
        items.forEach(item=>{
            item.addEventListener("click",()=>{
                items.forEach(i=>{
                    i.classList.remove("active"); 
            });
                item.classList.add("active");
                slider.style.left = item.offsetLeft + "px";
                slider.style.width = item.offsetWidth + "px";
                });   
        });  
        </script>
    </section>
</body>
